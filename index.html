<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫猫小屋 · Meow House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6E9;
    --paper:#FFFFFF;
    --ink:#4A2E1B;
    --orange:#F5A23E;
    --orange-deep:#D9722A;
    --pink:#F7A9BE;
    --green:#8FBF75;
    --shadow:#4A2E1B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;}
  body{
    font-family:'ZCOOL KuaiLe','Microsoft YaHei',system-ui,sans-serif;
    color:var(--ink);
    background-color:var(--cream);
    background-image:
      linear-gradient(rgba(245,162,62,.08) 1px,transparent 1px),
      linear-gradient(90deg,rgba(245,162,62,.08) 1px,transparent 1px),
      radial-gradient(circle at 12% 18%,rgba(247,169,190,.35) 0 6px,transparent 7px),
      radial-gradient(circle at 88% 30%,rgba(143,191,117,.35) 0 8px,transparent 9px),
      radial-gradient(circle at 78% 82%,rgba(245,162,62,.25) 0 7px,transparent 8px);
    background-size:24px 24px,24px 24px,100% 100%,100% 100%,100% 100%;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    padding:32px 16px 48px;
  }
  .wrap{max-width:920px;margin:0 auto;position:relative;z-index:2;}

  header{text-align:center;margin-bottom:26px;}
  h1{
    font-family:'Press Start 2P',monospace;
    font-size:26px;
    line-height:1.5;
    color:var(--orange-deep);
    letter-spacing:2px;
    text-shadow:3px 3px 0 var(--ink);
  }
  .subtitle{font-size:18px;color:var(--ink);margin-top:12px;letter-spacing:1px;}
  .domain{
    display:inline-block;margin-top:10px;padding:4px 12px;
    background:var(--ink);color:var(--cream);
    font-family:'Press Start 2P',monospace;font-size:10px;
    border-radius:2px;
  }

  .card{
    background:var(--paper);
    border:4px solid var(--ink);
    box-shadow:8px 8px 0 var(--shadow);
    border-radius:6px;
    padding:24px;
    display:grid;
    grid-template-columns:minmax(260px,1fr) 1fr;
    gap:24px;
    align-items:center;
  }

  .stage{position:relative;display:flex;flex-direction:column;align-items:center;}
  .bubble{
    position:relative;
    background:#fff;border:3px solid var(--ink);border-radius:10px;
    padding:8px 14px;font-size:16px;margin-bottom:14px;
    min-height:44px;display:flex;align-items:center;justify-content:center;
    box-shadow:4px 4px 0 rgba(74,46,27,.25);
    max-width:90%;
  }
  .bubble::after{
    content:"";position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;
    border-top:11px solid var(--ink);
  }
  .cat-frame{
    background:linear-gradient(180deg,#FFE9CF,#FFD9B0);
    border:4px solid var(--ink);border-radius:6px;
    padding:14px;box-shadow:inset 0 0 0 4px #fff;
  }
  canvas{
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    width:100%;max-width:336px;height:auto;
    cursor:pointer;
    animation:float 2.6s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .hint{font-size:13px;color:#8a6a52;margin-top:12px;}

  .panel h2{font-size:22px;color:var(--orange-deep);margin-bottom:6px;}
  .panel .tag{font-size:14px;color:#8a6a52;margin-bottom:16px;}
  .stats{list-style:none;margin-bottom:18px;}
  .stats li{
    display:flex;justify-content:space-between;
    padding:8px 0;border-bottom:2px dashed rgba(74,46,27,.18);
    font-size:16px;
  }
  .stats li span:first-child{color:#8a6a52;}
  .stats li span:last-child{font-weight:bold;}
  .feed{
    width:100%;
    font-family:'ZCOOL KuaiLe','Microsoft YaHei',sans-serif;
    font-size:18px;color:var(--ink);
    background:var(--orange);
    border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    border-radius:4px;
    padding:10px 14px;cursor:pointer;
    transition:transform .08s,box-shadow .08s;
  }
  .feed:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink);}
  .feed:hover{background:#ffb457;}
  .counter{text-align:center;margin-top:14px;font-size:15px;color:#8a6a52;}
  .counter b{color:var(--orange-deep);font-size:22px;}

  footer{text-align:center;margin-top:28px;font-size:14px;color:#8a6a52;line-height:1.8;}

  .paw{position:absolute;top:-40px;font-size:22px;opacity:.35;pointer-events:none;z-index:1;
       animation:fall linear infinite;}
  @keyframes fall{
    0%{transform:translateY(-40px) rotate(0);opacity:0;}
    10%{opacity:.45;}
    90%{opacity:.45;}
    100%{transform:translateY(105vh) rotate(220deg);opacity:0;}
  }
  .heart{position:absolute;font-size:20px;pointer-events:none;z-index:5;
         animation:rise 1s ease-out forwards;}
  @keyframes rise{
    0%{transform:translateY(0) scale(.6);opacity:1;}
    100%{transform:translateY(-90px) scale(1.2);opacity:0;}
  }

  @media(max-width:680px){
    h1{font-size:18px;}
    .card{grid-template-columns:1fr;padding:18px;gap:18px;}
    .subtitle{font-size:16px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MEOW HOUSE</h1>
    <div class="subtitle">猫猫小屋 · 欢迎光临</div>
    <div class="domain">meow.loc.cc</div>
  </header>

  <div class="card">
    <div class="stage">
      <div class="bubble" id="bubble">喵~ 点我一下试试？</div>
      <div class="cat-frame">
        <canvas id="cat" width="336" height="308" aria-label="一只可爱的像素猫"></canvas>
      </div>
      <div class="hint">（点猫咪可以逗它，投喂小鱼干它会很开心）</div>
    </div>

    <div class="panel">
      <h2>住户档案</h2>
      <div class="tag">一只爱卖萌的橘白猫</div>
      <ul class="stats">
        <li><span>名字</span><span>橘子</span></li>
        <li><span>品种</span><span>橘白猫</span></li>
        <li><span>特长</span><span>吃 · 睡 · 卖萌</span></li>
        <li><span>心情</span><span id="mood">开心</span></li>
      </ul>
      <button class="feed" id="feed">投喂小鱼干</button>
      <div class="counter">已投喂小鱼干 <b id="count">0</b> 条</div>
    </div>
  </div>

  <footer>
    本站由 GitHub Pages 提供动力 · 域名 meow.loc.cc<br>
    made with love &amp; pixels
  </footer>
</div>

<script>
(function(){
  const COLORS={
    K:'#4A2E1B', O:'#F5A23E', D:'#D9722A',
    W:'#FFFDF7', P:'#F7A9BE', E:'#3A2A1A', H:'#FFFFFF'
  };
  // 24 x 22 pixel art: a chubby orange-and-white cat
  const ART=[
    "........................",
    "....KK............KK....",
    "...KPPK..........KPPK...",
    "...KPOOK........KOOPK...",
    "...KPOOOK......KOOOPK...",
    "...KPOOOOK....KOOOOPK...",
    "...KPOOOOOK..KOOOOOPK...",
    ".KOOOOOOOOOOOOOOOOOOOOK.",
    ".KOOOOOOOOOOOOOOOOOOOOK.",
    ".KODDOOOOOOOOOOOOOODDOK.",
    ".KOOHEOOOOOOOOOOOOEHOOK.",
    ".KOOEEOOOOOOOOOOOOEEOOK.",
    ".KOPPOOOOOOPPOOOOOOPPOK.",
    ".KOOOOOOOOOKKOOOOOOOOOK.",
    ".KOOOOOOOOOOOOOOOOOOOOK.",
    ".KOOOOOOOWWWWWWOOOOOOOK.",
    ".KOOOOOOWWWWWWWWOOOOOOK.",
    ".KOOOOOWWWWWWWWWWOOOOOK.",
    ".KOOOOOWWWWWWWWWWOOOOOK.",
    "..KWWKWWWWWWWWWWWWKWWK..",
    "..KKKKKKKKKKKKKKKKKKKK..",
    "........................"
  ];
  const HAPPY_ART=ART.map(function(row,i){
    if(i===10) return ".KOOEEOOOOOOOOOOOOEEOOK.";
    if(i===11) return ".KOOOEOOOOOOOOOOOOEOOOK.";
    if(i===13) return ".KOOOOOOOOKWWKOOOOOOOOK.";
    return row;
  });

  const canvas=document.getElementById('cat');
  const ctx=canvas.getContext('2d');
  const cols=24, rows=22;
  const cell=canvas.width/cols;

  function draw(frame){
    const art=(frame==='happy')?HAPPY_ART:ART;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let y=0;y<rows;y++){
      const row=art[y]||'';
      for(let x=0;x<row.length && x<cols;x++){
        const c=COLORS[row[x]];
        if(c){ctx.fillStyle=c;ctx.fillRect(x*cell,y*cell,cell,cell);}
      }
    }
  }
  draw('normal');

  // blinking
  setInterval(function(){draw('happy');setTimeout(function(){draw('normal');},260);},4200);

  const bubble=document.getElementById('bubble');
  function say(text){
    bubble.textContent=text;
    bubble.style.transform='scale(1.06)';
    setTimeout(function(){bubble.style.transform='scale(1)';},150);
  }
  const meows=['喵~','喵呜！','摸摸头~','今天也要开心鸭','咕噜咕噜…'];
  function hearts(ev){
    for(let i=0;i<5;i++){
      const h=document.createElement('div');
      h.className='heart';
      h.textContent='♥';
      h.style.color=i%2?'#F7A9BE':'#D9722A';
      h.style.left=(ev.clientX-10+Math.random()*30)+'px';
      h.style.top=(ev.clientY-10)+'px';
      h.style.position='fixed';
      document.body.appendChild(h);
      setTimeout(function(){h.remove();},1000);
    }
  }
  canvas.addEventListener('click',function(ev){
    say(meows[Math.floor(Math.random()*meows.length)]);
    draw('happy');setTimeout(function(){draw('normal');},600);
    hearts(ev);
  });

  const countEl=document.getElementById('count');
  const moodEl=document.getElementById('mood');
  let count=0;
  try{count=parseInt(localStorage.getItem('meow_fish_count'),10)||0;}catch(e){}
  countEl.textContent=count;
  document.getElementById('feed').addEventListener('click',function(ev){
    count++;
    try{localStorage.setItem('meow_fish_count',count);}catch(e){}
    countEl.textContent=count;
    say('好吃！谢谢投喂！');
    moodEl.textContent='幸福';
    draw('happy');setTimeout(function(){draw('normal');},700);
    hearts(ev);
    setTimeout(function(){moodEl.textContent='开心';},2500);
  });

  // falling paw prints
  const paws=['🐾','✦','♥'];
  for(let i=0;i<14;i++){
    const p=document.createElement('div');
    p.className='paw';
    p.textContent=paws[i%paws.length];
    p.style.left=(Math.random()*100)+'vw';
    p.style.fontSize=(14+Math.random()*14)+'px';
    p.style.animationDuration=(9+Math.random()*10)+'s';
    p.style.animationDelay=(-Math.random()*16)+'s';
    document.body.appendChild(p);
  }
})();
</script>
</body>
</html>
